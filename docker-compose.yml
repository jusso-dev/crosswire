# Local development stack (#12). Linux is the happy path; macOS/Windows work via Docker Desktop/OrbStack.
#   cp .env.example .env && docker compose up --build
# Redis is optional and unused by v1 code; enable with: docker compose --profile redis up
name: crosswire

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crosswire
      # Local-only default. Change it (and DATABASE_URL) before exposing this host to any network.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crosswire-local-dev}
      POSTGRES_DB: crosswire
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only: not reachable from other machines.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosswire -d crosswire"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot migration runner (#69). web starts only after it exits successfully.
  migrate:
    image: crosswire:web
    build: .
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://crosswire:${POSTGRES_PASSWORD:-crosswire-local-dev}@postgres:5432/crosswire
    command: ["node_modules/.bin/tsx", "src/server/cli/migrate.ts"]
    # One-shot: it serves nothing, so the image's web health check does not apply (#151).
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: crosswire:web
    env_file: .env
    environment:
      DATABASE_URL: postgres://crosswire:${POSTGRES_PASSWORD:-crosswire-local-dev}@postgres:5432/crosswire
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: crosswire:web
    env_file: .env
    environment:
      DATABASE_URL: postgres://crosswire:${POSTGRES_PASSWORD:-crosswire-local-dev}@postgres:5432/crosswire
      NODE_ENV: ${NODE_ENV:-development}
    command: ["node_modules/.bin/tsx", "src/server/cli/worker.ts"]
    # The worker's own health server (#142, #151): 200 while the last loop finished under 3 minutes ago.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.WORKER_HEALTH_PORT||3001)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      web:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
