# CI (#14): lint, typecheck, unit/integration tests, build. GitHub-hosted runners only; no secrets
# needed, so forks run it too. Tests use PGlite (in-process Postgres) plus a Postgres service
# container for the real-driver checks; no e2e tests in CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres for test/pg-real.test.ts: catches queries PGlite accepts but postgres-js rejects.
    # Throwaway service container; the password is a fixed CI-only value, not a secret.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crosswire
          POSTGRES_PASSWORD: crosswire-ci
          POSTGRES_DB: crosswire_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crosswire" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (generates the route tree used by typecheck)
        run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          PG_TEST_URL: postgres://crosswire:crosswire-ci@localhost:5432/crosswire_test
      - name: Migrations are in sync with the schema
        working-directory: apps/web
        run: |
          pnpm exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

  docker:
    name: Docker image (build, SBOM, CVE gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: crosswire:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM (SPDX, #85)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: crosswire:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-ci.spdx.json
      - name: Vulnerability gate (CRITICAL, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crosswire:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
