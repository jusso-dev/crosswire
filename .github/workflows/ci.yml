# CI (#14): lint, typecheck, unit/integration tests, build. GitHub-hosted runners only; no secrets
# needed, so forks run it too. Tests use PGlite (in-process Postgres); no e2e tests in CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (generates the route tree used by typecheck)
        run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations are in sync with the schema
        working-directory: apps/web
        run: |
          pnpm exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crosswire:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
