# Run the post-deploy smoke test against any URL (#75), e.g. a lab or after a manual rollback.
name: Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL, e.g. https://crosswire.example.com
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          BASE_URL: ${{ inputs.base_url }}
        run: bash scripts/smoke.sh "$BASE_URL"
