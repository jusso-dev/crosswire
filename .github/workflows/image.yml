# Reusable: build the production image, generate an SBOM, fail on CRITICAL CVEs in the runtime
# image (#85), then push to GHCR. Callers pass extra tags (e.g. the git tag); :sha-<sha> is always added.
# After the push, signed build provenance and SBOM attestations are bound to the image digest.
# Callers must grant packages: write, id-token: write and attestations: write.
name: Image

on:
  workflow_call:
    inputs:
      tags:
        description: Extra tag (e.g. v1.2.3). Optional.
        type: string
        default: ''
    outputs:
      image:
        description: Immutable image reference, pinned to the attested digest (repo@sha256:...)
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificate for attestations
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.repo }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: crosswire:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Syft 1.54.0 on GitHub releases returns 504. The same version is on Docker Hub.
      - name: SBOM (SPDX)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/out \
            anchore/syft:v1.54.0 \
            crosswire:scan -o spdx-json=/out/sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Vulnerability gate (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crosswire:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          REPO: ${{ steps.meta.outputs.repo }}
          EXTRA_TAG: ${{ inputs.tags }}
        run: |
          docker tag crosswire:scan "$IMAGE"
          # Digest reported by this push itself, so a concurrent build that re-pushes the same
          # sha tag cannot swap the image these attestations are bound to.
          digest="$(docker push "$IMAGE" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n1)"
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::could not read the digest from docker push ($digest)"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Signed SLSA provenance + SBOM attestations bound to the pushed digest (verify: docs/releasing.md).
      # actions/attest supersedes attest-build-provenance / attest-sbom (now thin wrappers over it).
      # Storage records need an organisation-owned repo, so they are off.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      # The version tag is published only after both attestations succeed, and points at the
      # attested digest, so a release tag never exists without provenance.
      - name: Publish version tag
        if: inputs.tags != ''
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          EXTRA_TAG: ${{ inputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: docker buildx imagetools create --tag "$REPO:$EXTRA_TAG" "$REPO@$DIGEST"
