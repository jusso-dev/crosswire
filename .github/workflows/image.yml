# Reusable: build the production image, generate an SBOM, fail on CRITICAL CVEs in the runtime
# image (#85), then push to GHCR. Callers pass extra tags (e.g. the git tag); :sha-<sha> is always added.
# After the push, signed build provenance and SBOM attestations are bound to the image digest.
# Callers must grant packages: write, id-token: write and attestations: write.
name: Image

on:
  workflow_call:
    inputs:
      tags:
        description: Extra tag (e.g. v1.2.3). Optional.
        type: string
        default: ''
    outputs:
      image:
        description: Immutable image reference (sha tag)
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificate for attestations
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: crosswire:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: crosswire:scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Vulnerability gate (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crosswire:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          REPO: ${{ steps.meta.outputs.repo }}
          EXTRA_TAG: ${{ inputs.tags }}
        run: |
          docker tag crosswire:scan "$IMAGE"
          docker push "$IMAGE"
          if [ -n "$EXTRA_TAG" ]; then
            docker tag crosswire:scan "$REPO:$EXTRA_TAG"
            docker push "$REPO:$EXTRA_TAG"
          fi
          # Digest as served by the registry for the sha tag (what `oci://...:sha-<sha>` resolves to).
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::could not resolve pushed digest ($digest)"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Signed SLSA provenance + SBOM attestations bound to the pushed digest (verify: docs/releasing.md).
      # actions/attest supersedes attest-build-provenance / attest-sbom (now thin wrappers over it).
      # Storage records need an organisation-owned repo, so they are off.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
