# Reusable: build the production image, generate an SBOM, fail on CRITICAL CVEs in the runtime
# image (#85), then push to GHCR. Callers pass extra tags (e.g. the git tag); :sha-<sha> is always added.
# After the push, signed build provenance and SBOM attestations are bound to the image digest.
# Callers must grant packages: write, id-token: write and attestations: write.
name: Image

on:
  workflow_call:
    inputs:
      tags:
        description: Extra tag (e.g. v1.2.3). Optional.
        type: string
        default: ''
    outputs:
      image:
        description: Immutable image reference, pinned to the attested digest (repo@sha256:...)
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificate for attestations
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.repo }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: crosswire:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Syft scans a saved image archive, mounted read-only (#145). No Docker socket in a third-party
      # container in a job that holds registry credentials. Pinned by digest; bump it by hand.
      - name: SBOM (SPDX)
        run: |
          docker save crosswire:scan -o image.tar
          docker run --rm \
            -v "$PWD/image.tar":/image.tar:ro \
            -v "$PWD":/out \
            anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c \
            docker-archive:/image.tar -o spdx-json=/out/sbom.spdx.json
          rm image.tar
          test -s sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error
      # ignore-unfixed stays at build time: a CVE with no fix cannot be acted on by rebuilding, and
      # failing on it would block every deploy. The weekly image scan (image-scan.yml) reports
      # HIGH and CRITICAL, fixed or not, to code scanning.
      - name: Vulnerability gate (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crosswire:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          REPO: ${{ steps.meta.outputs.repo }}
          EXTRA_TAG: ${{ inputs.tags }}
        run: |
          docker tag crosswire:scan "$IMAGE"
          # Digest reported by this push itself, so a concurrent build that re-pushes the same
          # sha tag cannot swap the image these attestations are bound to.
          digest="$(docker push "$IMAGE" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n1)"
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::could not read the digest from docker push ($digest)"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Signed SLSA provenance + SBOM attestations bound to the pushed digest (verify: docs/releasing.md).
      # actions/attest supersedes attest-build-provenance / attest-sbom (now thin wrappers over it).
      # Storage records need an organisation-owned repo, so they are off.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      # The version tag is published only after both attestations succeed, and points at the
      # attested digest, so a release tag never exists without provenance.
      - name: Publish version tag
        if: inputs.tags != ''
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          EXTRA_TAG: ${{ inputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: docker buildx imagetools create --tag "$REPO:$EXTRA_TAG" "$REPO@$DIGEST"
