# Release (#76): push a semver tag vX.Y.Z on main -> verify CI -> build, scan (#85) and push
# ghcr.io/<owner>/crosswire:vX.Y.Z (+ :sha-<full sha>) -> GitHub Release with CHANGELOG notes + SBOM.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      tags: ${{ github.ref_name }}

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - name: Extract CHANGELOG section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ || /^\[[^]]+\]: / {if (f) exit} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $v"; exit 1; fi
          printf '\n\nImage: %s (also tagged %s)\n' "${{ needs.image.outputs.image }}" "$GITHUB_REF_NAME" >> notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Crosswire $GITHUB_REF_NAME" --notes-file notes.md --verify-tag sbom.spdx.json
