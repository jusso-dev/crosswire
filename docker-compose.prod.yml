# Production-like stack for any Docker host (#58). No source bind mounts; runtime image only.
#   cp infra/compose.prod.env.example .env.prod   # fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Put TLS in front (Caddy/Traefik/nginx); see docs/runbooks/local-docker.md.
name: crosswire-prod

# The app gets the password as PGPASSWORD, not inside the URL, so any characters work (#152).
# postgres.js uses PGPASSWORD when DATABASE_URL has no password. To use an external database, set
# DATABASE_URL in .env.prod (with sslmode=verify-full) and leave the bundled postgres unused.
x-db-env: &db-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgres://crosswire@postgres:5432/crosswire}
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (never use a default in production)}

# Rotate container logs so they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crosswire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (never use a default in production)}
      POSTGRES_DB: crosswire
    logging: *logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: only reachable on the internal compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosswire -d crosswire"]
      interval: 10s
      timeout: 3s
      retries: 10
    # Resource hints: tune for your host.
    deploy:
      resources:
        limits: { memory: 1g }

  # One-shot migration runner (#69). web starts only after it exits successfully.
  migrate:
    image: ${CROSSWIRE_IMAGE:-crosswire:web}
    build: .
    restart: "no"
    env_file: .env.prod
    environment: *db-env
    logging: *logging
    command: ["node_modules/.bin/tsx", "src/server/cli/migrate.ts"]
    # One-shot: it serves nothing, so the image's web health check does not apply (#151).
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${CROSSWIRE_IMAGE:-crosswire:web}
    restart: unless-stopped
    env_file: .env.prod
    environment: *db-env
    logging: *logging
    ports:
      # Bind to loopback and terminate TLS in a reverse proxy on the same host.
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1g }

  worker:
    image: ${CROSSWIRE_IMAGE:-crosswire:web}
    restart: unless-stopped
    env_file: .env.prod
    environment: *db-env
    logging: *logging
    command: ["node_modules/.bin/tsx", "src/server/cli/worker.ts"]
    # The worker's own health server (#142, #151): 200 while the last loop finished under 3 minutes ago.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.WORKER_HEALTH_PORT||3001)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 512m }
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
